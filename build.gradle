plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			// Keep the dev game small enough for 8 GB machines.
			vmArgs "-Xms256M", "-Xmx2G"
		}
		server {
			// Separate folder so the test server does not share worlds or configs with the client.
			runDir "run-server"
			vmArgs "-Xms256M", "-Xmx1G"
		}
	}

	mods {
		"ghostmason" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	maven {
		name = 'EngineHub'
		url = 'https://maven.enginehub.org/repo/'
		content {
			includeGroup 'org.enginehub.worldeditcui-protocol'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional: WorldEdit selection sync. Not bundled; used only when WorldEdit or
	// WorldEditCUI (which both ship this library) is installed.
	clientCompileOnly "org.enginehub.worldeditcui-protocol:worldeditcui-protocol-common-mc${project.minecraft_version}:${project.wecui_protocol_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
